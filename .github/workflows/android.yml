name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "tests/**", "native/**", "capacitor.config.json", "package.json", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Run tests (the build stops if any fail)
        run: node tests/run.mjs
      - name: Install Capacitor
        run: npm install --no-audit --no-fund @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/local-notifications@latest
      - name: Prepare web files
        run: npm run www
      - name: Create Android project
        run: npx cap add android
      - name: Add notification reader
        run: |
          set -e
          SRC=android/app/src/main/java/com/bujjet/app
          mkdir -p $SRC
          cp native/java/*.java $SRC/
          mkdir -p android/app/src/main/res/drawable && cp native/res/drawable/*.xml android/app/src/main/res/drawable/
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          svc='''        <service android:name=".NotifService" android:label="bujjet" android:exported="true"
                  android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                  <intent-filter><action android:name="android.service.notification.NotificationListenerService" /></intent-filter>
              </service>
          </application>'''
          if 'NotifService' not in s:
              s=s.replace('</application>',svc,1)
          tile='''        <service android:name=".LogTile" android:label="Log to bujjet" android:icon="@drawable/ic_tile" android:exported="true"
                  android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                  <intent-filter><action android:name="android.service.quicksettings.action.QS_TILE" /></intent-filter>
              </service>
          </application>'''
          if 'LogTile' not in s:
              s=s.replace('</application>',tile,1)
          filt='''<intent-filter android:label="Log to bujjet">
                      <action android:name="android.intent.action.PROCESS_TEXT" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="text/plain" />
                  </intent-filter>
                  <intent-filter android:label="Log to bujjet">
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="text/plain" />
                  </intent-filter>
              </activity>'''
          perms='<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <application'
          if 'POST_NOTIFICATIONS' not in s:
              s=s.replace('<application',perms,1)
          if 'PROCESS_TEXT' not in s:
              i=s.index('.MainActivity'); j=s.index('</activity>',i)
              s=s[:j]+filt+s[j+len('</activity>'):]
          open(p,'w').write(s)
          PY
      - name: App icon
        continue-on-error: true
        run: |
          mkdir -p assets && cp icon-512.png assets/icon.png && cp icon-512.png assets/icon-only.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0e0e0e' --iconBackgroundColorDark '#0e0e0e'
      - name: Sync
        run: npx cap sync android
      - name: Sign test builds with one fixed key (so new builds install over old ones)
        run: |
          cat >> android/app/build.gradle <<'GR'

          android {
              signingConfigs {
                  testKey {
                      storeFile rootProject.file("../native/signing/test.jks")
                      storePassword "bujjet-test"
                      keyAlias "bujjettest"
                      keyPassword "bujjet-test"
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.testKey } }
          }
          dependencies {
              implementation 'com.google.android.gms:play-services-auth:21.3.0'
              implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
          }
          GR
      - name: Set app version (from APP_VERSION in index.html)
        run: |
          python3 - <<'PY'
          import re,os
          v=re.search(r'const APP_VERSION="(\d+)\.(\d+)\.(\d+)"',open('index.html').read())
          assert v, "APP_VERSION missing"
          M,m,p=map(int,v.groups()); name=f"{M}.{m}.{p}"; code=M*1000000+m*1000+p+1000
          g='android/app/build.gradle'; s=open(g).read()
          s=re.sub(r'versionCode\s+\d+',f'versionCode {code}',s,1); s=re.sub(r'versionName\s+"[^"]*"',f'versionName "{name}"',s,1)
          open(g,'w').write(s)
          vg='android/variables.gradle'; t=open(vg).read(); t=re.sub(r'minSdkVersion\s*=\s*\d+','minSdkVersion = 26',t); open(vg,'w').write(t)  # Gemini Nano (ML Kit GenAI) needs Android 8+
          open(os.environ['GITHUB_ENV'],'a').write(f"APP_VERSION={name}\n"); print(name,code)
          PY
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Publish test APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk bujjet-test.apk
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test bujjet-test.apk --title "bujjet ${APP_VERSION} (Android test build)" --notes "Version ${APP_VERSION}, test build from ${GITHUB_SHA::7}. Install on Android to try automatic transaction detection." --prerelease
